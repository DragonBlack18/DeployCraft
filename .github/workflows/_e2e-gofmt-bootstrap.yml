# One-time formatting only; deleted after first green run.
name: DeployCraft | phase1 e2e gofmt bootstrap
on:
  push:
    branches: [feature/fase1-e2e-processo-windows]
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'DragonBlack18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply gofmt to Windows test and commit
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w src/app/engine_windows_test.go
          if git diff --quiet -- src/app/engine_windows_test.go; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/engine_windows_test.go
          git commit -m "style: formata teste E2E Windows"
          git push origin HEAD:feature/fase1-e2e-processo-windows
