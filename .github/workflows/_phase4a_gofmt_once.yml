name: DeployCraft | gofmt Fase4A (temporario)
on:
  push:
    branches: [feature/fase4a-retry-transitorio]
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'DragonBlack18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Go format and commit Go files only
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w src/app/engine.go src/app/retry.go src/app/retry_test.go
          if git diff --quiet -- '*.go'; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- '*.go'
          git commit -m 'style: normaliza gofmt do retry da Fase 4A'
          git push origin HEAD:feature/fase4a-retry-transitorio
