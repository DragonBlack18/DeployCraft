name: DeployCraft | quality and environments

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploycraft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Quality gate
        run: go run ./scripts/check
      - name: Race detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...

  authenticode:
    name: authenticode-sfx-windows
    needs: [quality]
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Sign SFX with ephemeral LAB certificate and verify signed PE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP ('deploycraft-sign-' + [guid]::NewGuid().ToString('N'))
          New-Item -Path $dir -ItemType Directory -Force | Out-Null
          $key = Join-Path $dir 'catalog.private.pem'
          $public = Join-Path $dir 'catalog.public.pem'
          $unsigned = Join-Path $dir 'DeployCraft-unsigned.exe'
          $signed = Join-Path $dir 'DeployCraft-signed.exe'
          $tampered = Join-Path $dir 'DeployCraft-tampered.exe'
          $certificate = $null
          try {
            go run ./cmd/kit-builder keygen --root . --private $key --public $public
            if ($LASTEXITCODE -ne 0) { throw 'Keygen failed' }
            go run ./cmd/kit-builder build --mode sfx --root . --out $unsigned --private-key $key
            if ($LASTEXITCODE -ne 0) { throw 'SFX build failed' }
            go run ./cmd/kit-builder inspect-sfx --file $unsigned
            if ($LASTEXITCODE -ne 0) { throw 'SFX verification before signing failed' }
            $originalHash = (Get-FileHash -LiteralPath $unsigned -Algorithm SHA256).Hash
            $certificate = New-SelfSignedCertificate -Subject 'CN=DeployCraft CI Test' -Type CodeSigningCert -KeyAlgorithm RSA -KeyLength 2048 -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(2)
            $certificateFile = Join-Path $dir 'test-public.cer'
            Export-Certificate -Cert $certificate -FilePath $certificateFile | Out-Null
            foreach ($storeName in @('Root','TrustedPublisher')) {
              $store = [System.Security.Cryptography.X509Certificates.X509Store]::new($storeName, [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
              try {
                $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
                $store.Add($certificate)
              } finally { $store.Close() }
            }
            Write-Host 'CI certificate placed in temporary user trust stores'
            Write-Host 'Signing finished SFX overlay after catalog verification'
            & ./scripts/sign/Sign-DeployCraft.ps1 -InputFile $unsigned -OutputFile $signed -Thumbprint $certificate.Thumbprint -ExpectedSHA256 $originalHash -LabNoTimestamp
            if (!(Test-Path -LiteralPath $signed)) { throw 'Signed binary missing' }
            if ((Get-FileHash -LiteralPath $unsigned -Algorithm SHA256).Hash -ne $originalHash) { throw 'Signer modified source' }
            & ./scripts/sign/Test-Authenticode.ps1 -File $signed -ExpectedThumbprint $certificate.Thumbprint
            go run ./cmd/kit-builder inspect-sfx --file $signed
            if ($LASTEXITCODE -ne 0) { throw 'Signed SFX pack unreadable' }
            $listOutput = & $signed list | Out-String
            if ($LASTEXITCODE -ne 0 -or $listOutput -notmatch 'Cat.logo') { throw 'Signed SFX cannot read authenticated catalog' }
            [IO.File]::Copy($signed, $tampered, $false)
            $stream = [IO.File]::Open($tampered,[IO.FileMode]::Open,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None)
            try {
              if ($stream.Length -lt 4097) { throw 'Fixture unexpectedly small' }
              $stream.Position = 4096
              $oldByte = $stream.ReadByte()
              $stream.Position = 4096
              $stream.WriteByte([byte]($oldByte -bxor 1))
            } finally { $stream.Dispose() }
            if ((Get-AuthenticodeSignature -LiteralPath $tampered).Status -eq 'Valid') { throw 'Tampered signed motor accepted' }
            Write-Host 'PASS: signed SFX reader, editor, SHA-256 and tamper rejection'
          } finally {
            if ($null -ne $certificate) {
              foreach ($store in @('CurrentUser\TrustedPublisher','CurrentUser\Root','CurrentUser\My')) {
                $path = ('Cert:\' + $store + '\' + $certificate.Thumbprint)
                if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue }
              }
            }
          }

  bundle:
    name: unsigned-foundation-${{ github.ref_name }}
    needs: [quality, authenticode]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Windows x64 CLIs (NOT an installable release)
        shell: pwsh
        run: |
          New-Item -Path dist -ItemType Directory -Force | Out-Null
          go build -trimpath -ldflags '-s -w' -o dist/DeployCraft.exe ./cmd/deploycraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags '-s -w' -o dist/kit-builder.exe ./cmd/kit-builder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8
      - name: Publish unsigned foundation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeployCraft-foundation-${{ github.ref_name }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

# Never execute third-party installers in a GitHub Actions runner.
# Configure review and branch restrictions in Settings > Environments.
