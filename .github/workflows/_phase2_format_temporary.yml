name: DeployCraft | formatador temporario da Fase 2
on:
  push:
    branches: [feature/fase2-planejamento-retomada]
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'DragonBlack18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Aplicar gofmt e registrar apenas arquivos Go alterados
        shell: bash
        run: |
          set -euo pipefail
          find cmd src scripts tools -name '*.go' -print0 | xargs -0 gofmt -w
          if git diff --quiet -- '*.go'; then
            echo "Formatacao em conformidade"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.go'
          git commit -m "style: normaliza gofmt na Fase 2"
          git push origin HEAD:feature/fase2-planejamento-retomada
