name: DeployCraft | one-time resume gofmt
on:
  push:
    branches: [feature/resume-catalog-digest]
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'DragonBlack18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply gofmt and commit only changed Go code
        shell: bash
        run: |
          set -euo pipefail
          find src -name '*.go' -print0 | xargs -0 gofmt -w
          if git diff --quiet -- '*.go'; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- '*.go'
          git commit -m 'style: gofmt do fingerprint e journal de retomada'
          git push origin HEAD:feature/resume-catalog-digest
